<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <title>Open Graph image</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #034694;
      }

      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg id="og" width="1200" height="630" viewBox="0 0 1200 630"></svg>
    <script type="module">
      const W = 1200;
      const H = 630;
      const MARGIN = 64;
      const BYLINE = "Frontend Engineer";

      const GROUND = "#034694";
      const INK = "#fff";
      const MEASURE = "#ff9ebb";
      const DISPLAY = "Archivo";
      const MONO = '"IBM Plex Mono"';

      await document.fonts.load(`850 100px ${DISPLAY}`);
      await document.fonts.load(`600 46px ${DISPLAY}`);
      await document.fonts.load(`500 26px ${MONO}`);

      const ctx = document.createElement("canvas").getContext("2d");

      // Ink box of a string, so edges and guides sit on the letters themselves
      function ink(
        text,
        { size, weight, stretch = "normal", tracking = 0, family = DISPLAY }
      ) {
        ctx.font = `${weight} ${size}px ${family}`;
        ctx.fontStretch = stretch;
        ctx.letterSpacing = `${tracking * size}px`;

        const m = ctx.measureText(text);

        return {
          left: -m.actualBoundingBoxLeft,
          right: m.actualBoundingBoxRight,
          ascent: m.actualBoundingBoxAscent,
          advance: m.width,
        };
      }

      // The name, sized so the longer line spans the page
      const name = { weight: 850, stretch: "expanded", tracking: -0.02 };
      const probe = ink("JOSHUA", { ...name, size: 100 });
      const size = (100 * (W - 2 * MARGIN - 80)) / (probe.right - probe.left);
      const display = { ...name, size };
      const cap = ink("H", display).ascent;

      const byline = { size: 46, weight: 600 };
      const bylineBase = H - MARGIN + 2;
      const secondBase = bylineBase - ink("F", byline).ascent - 66;
      const firstBase = secondBase - 0.84 * size;

      const [first, second] = [
        { text: "JOSHUA", base: firstBase },
        { text: "BOOTH", base: secondBase },
      ].map((line) => {
        const box = ink(line.text, display);

        return {
          ...line,
          x: MARGIN - box.left,
          right: MARGIN + box.right - box.left,
          top: line.base - cap,
        };
      });

      // The build sweep has reached the T, so JOSH and BOO are finished and the rest is still drawn
      const seam = second.x + ink("BOO", display).advance - 10;

      const svg = document.getElementById("og");

      function el(tag, attrs, parent = svg) {
        const node = document.createElementNS(
          "http://www.w3.org/2000/svg",
          tag
        );

        for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);

        parent.append(node);

        return node;
      }

      function text(content, attrs, parent = svg) {
        el("text", attrs, parent).textContent = content;
      }

      function nameLine(line, attrs, parent) {
        text(
          line.text,
          {
            x: line.x,
            y: line.base,
            style: `font: ${name.weight} ${size}px ${DISPLAY}; font-stretch: 125%; letter-spacing: ${name.tracking}em`,
            ...attrs,
          },
          parent
        );
      }

      function region(id, x, width) {
        el("clipPath", { id }, defs).append(
          el("rect", { x, y: 0, width, height: H }, defs)
        );

        return `url(#${id})`;
      }

      const defs = el("defs", {});
      const grid = el(
        "pattern",
        {
          id: "grid",
          x: MARGIN,
          y: firstBase,
          width: 40,
          height: 40,
          patternUnits: "userSpaceOnUse",
        },
        defs
      );

      el(
        "rect",
        { width: 40, height: 1.5, fill: "rgba(255, 255, 255, 0.15)" },
        grid
      );
      el(
        "rect",
        { width: 1.5, height: 40, fill: "rgba(255, 255, 255, 0.15)" },
        grid
      );
      el(
        "feGaussianBlur",
        { stdDeviation: 10 },
        el("filter", { id: "blur", x: "-50%", width: "200%" }, defs)
      );

      const ahead = region("ahead", seam, W - seam);
      const behind = region("behind", 0, seam);

      el("rect", { width: W, height: H, fill: GROUND });
      el("rect", {
        width: W,
        height: H,
        fill: "url(#grid)",
        "clip-path": ahead,
      });

      // Guides on each line's baseline and cap height, under the letters
      for (const line of [first, second]) {
        const stroke = "rgba(255, 255, 255, 0.6)";

        el("line", {
          x1: 0,
          x2: W,
          y1: line.base,
          y2: line.base,
          stroke,
          "stroke-width": 2,
        });
        el("line", {
          x1: 0,
          x2: W,
          y1: line.top,
          y2: line.top,
          stroke,
          "stroke-width": 2,
          "stroke-dasharray": "10 8",
        });
      }

      const drawn = el("g", { "clip-path": ahead });
      const built = el("g", { "clip-path": behind });

      for (const line of [first, second]) {
        nameLine(
          line,
          {
            fill: "rgba(255, 255, 255, 0.16)",
            stroke: INK,
            "stroke-width": 3.5,
            "stroke-linejoin": "miter",
          },
          drawn
        );
        nameLine(line, { fill: INK }, built);
      }

      // The second line's cap height, measured
      const mx = second.right + 40;

      el("path", {
        d: `M${mx} ${second.top}V${second.base}M${mx - 12} ${second.top}H${mx + 12}M${mx - 12} ${second.base}H${mx + 12}`,
        stroke: MEASURE,
        "stroke-width": 3,
        fill: "none",
      });
      text(Math.round(cap), {
        x: mx + 22,
        y: second.base - cap / 2,
        "dominant-baseline": "central",
        fill: MEASURE,
        stroke: GROUND,
        "stroke-width": 10,
        "paint-order": "stroke",
        style: `font: 500 26px ${MONO}`,
      });

      // The spec chip, on the drawn side of the edge
      const spec = `Archivo · 850 · 125% · ${Math.round(size)}px`;
      const chip = { size: 17, padX: 7, height: 26 };
      const chipWidth =
        ink(spec, { size: chip.size, weight: 500, family: MONO }).advance +
        2 * chip.padX;
      const chipX = seam + 16;
      const chipY = first.top - 12 - chip.height;

      el("rect", {
        x: chipX,
        y: chipY,
        width: chipWidth,
        height: chip.height,
        rx: 3,
        fill: INK,
      });
      text(spec, {
        x: chipX + chip.padX,
        y: chipY + chip.height / 2,
        "dominant-baseline": "central",
        fill: GROUND,
        style: `font: 500 ${chip.size}px ${MONO}`,
      });

      // The sweep's edge, glowing like the one on the home page
      el("rect", {
        x: seam - 6,
        y: 0,
        width: 12,
        height: H,
        fill: "rgba(190, 210, 255, 0.6)",
        filter: "url(#blur)",
      });
      el("rect", { x: seam - 1.5, y: 0, width: 3, height: H, fill: INK });

      // The jb mark, copied from src/shared/ui/jb-mark.tsx
      const mark = el("svg", {
        x: MARGIN,
        y: MARGIN - 8,
        width: 62,
        height: (62 * 932.3) / 1099.4,
        viewBox: "-71.7 -724.8 1099.4 932.3",
        fill: INK,
      });

      el(
        "path",
        {
          d: "M62.5 -595.3V-724.8H266.9V-595.3ZM60 207.5Q41 207.5 17.2 205.3Q-6.7 203.1 -29.9 198.9Q-53 194.7 -71.7 189.7V74.3H-14Q23.3 74.3 42.9 54.5Q62.5 34.7 62.5 3V-527.8H266.9V6Q266.9 71.4 246.9 116.4Q226.8 161.4 181.6 184.4Q136.3 207.5 60 207.5Z",
        },
        mark
      );
      el(
        "path",
        {
          d: "M460.7 12Q401.3 12 347.2 -8.7Q293 -29.5 252.9 -82.2H244.2L228.3 0H62.5V-724.8H266.9V-467.7H275.4Q298.2 -493.7 330 -509.7Q361.7 -525.6 396.7 -532.7Q431.6 -539.8 462.8 -539.8Q541.5 -539.8 604.3 -510.2Q667 -480.5 703.9 -419.5Q740.7 -358.5 740.7 -263.8Q740.7 -169.5 703.8 -108.3Q666.8 -47.2 603.6 -17.6Q540.4 12 460.7 12ZM399.5 -134.9Q445.1 -134.9 474.7 -150.4Q504.4 -166 518.9 -193.5Q533.4 -220.9 533.4 -255.2V-272.5Q533.4 -306.9 518.9 -333.8Q504.4 -360.8 475 -376.8Q445.5 -392.9 399.9 -392.9Q365.6 -392.9 340.3 -383.2Q315.1 -373.4 298.5 -356.6Q281.9 -339.8 273.9 -317Q265.9 -294.2 265.9 -267V-260.5Q265.9 -225.2 280.1 -196.5Q294.3 -167.8 324.1 -151.3Q353.9 -134.9 399.5 -134.9Z",
          transform: "translate(287 0)",
        },
        mark
      );

      text(BYLINE, {
        x: MARGIN - ink(BYLINE, byline).left,
        y: bylineBase,
        fill: INK,
        style: `font: ${byline.weight} ${byline.size}px ${DISPLAY}`,
      });

      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
