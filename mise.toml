[settings]
# Node comes from .node-version, which Netlify reads too
idiomatic_version_file_enable_tools = ["node"]

[tools]
# Netlify reads the pnpm version from package.json's packageManager field, so keep the two in step
pnpm = "12.8.1"

[env]
_.path = ["./node_modules/.bin"]
SITE_FLAGS = "{{ get_env(name='SITE_FLAGS', default='none') }}"

[tasks.dev]
description = "Start development server"
alias = "d"
run = "next dev"

[tasks.build]
description = "Build the application"
alias = "b"
run = "next build"

[tasks.preview]
description = "Serve the production build (run build first)"
alias = "p"
run = "next start"

[tasks.format]
description = "Format code with oxfmt"
alias = "f"
run = "oxfmt"

[tasks."format:check"]
description = "Check code formatting with oxfmt"
alias = "fc"
run = "oxfmt --check"

[tasks.lint]
description = "Fix code with oxlint"
alias = "l"
run = "oxlint --type-aware --max-warnings 0 --fix"

[tasks."lint:check"]
description = "Check code with oxlint"
alias = "lc"
run = "oxlint --type-aware --max-warnings 0"

[tasks.stylelint]
description = "Fix CSS with Stylelint"
alias = "sl"
run = "stylelint \"src/**/*.css\" --fix"

[tasks."stylelint:check"]
description = "Check CSS with Stylelint"
alias = "slc"
run = "stylelint \"src/**/*.css\""

[tasks.steiger]
description = "Check the Feature-Sliced Design structure"
alias = "fsd"
run = "steiger ./src"

[tasks.knip]
description = "Find unused files, dependencies, exports and config"
alias = "k"
run = "knip --treat-config-hints-as-errors"

[tasks."knip:fix"]
description = "Auto-remove unused exports"
alias = "kf"
run = "knip --fix"

[tasks.spell]
description = "Check spelling with cspell"
alias = "sp"
run = "cspell ."

[tasks.typecheck]
description = "Run TypeScript type checking"
alias = "tt"
run = "next typegen && tsc --noEmit"

[tasks.test]
description = "Run tests in watch mode"
alias = "t"
run = "vitest"

[tasks."test:run"]
description = "Run tests once"
alias = "tr"
run = "vitest run"

[tasks.audit]
description = "Run the overlap, navigation and hover audits against a production build on port 3000 (start it with SITE_FLAGS=all mise run preview)"
alias = "a"
run = "node scripts/audit/run.ts"

[tasks.fix]
description = "Auto-fix all code quality issues"
alias = "x"
depends = ["format", "lint", "stylelint", "knip:fix"]

[tasks.check]
description = "Run all code quality checks and the tests"
alias = "c"
depends = [
  "format:check",
  "lint:check",
  "stylelint:check",
  "typecheck",
  "steiger",
  "knip",
  "spell",
  "test:run",
]

[tasks.clean]
description = "Remove build artifacts and cache"
confirm = "This will delete .next, coverage and audit output. Continue?"
run = "rm -rf .next coverage audit-output tsconfig.tsbuildinfo"
