[build]
publish = "out"
command = "pnpm run build"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*.md"
[headers.values]
Content-Type = "text/markdown; charset=utf-8"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Deploy previews show every flagged part, so a PR can be reviewed with them on
[context.deploy-preview.environment]
SITE_FLAGS = "all"
