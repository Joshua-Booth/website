[build]
publish = "out"
command = "pnpm run build"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The home screen icon is public/apple-icon.png; crawlers and audits ask for the conventional names
[[redirects]]
from = "/apple-touch-icon.png"
to = "/apple-icon.png"
status = 200

[[redirects]]
from = "/apple-touch-icon-precomposed.png"
to = "/apple-icon.png"
status = 200

# The white icons and share card were served under -white names for a day
# before they became the only ones
[[redirects]]
from = "/og-white.png"
to = "/og.png"
status = 301

[[redirects]]
from = "/icon-white.svg"
to = "/icon.svg"
status = 301

[[redirects]]
from = "/favicon-white.ico"
to = "/favicon.ico"
status = 301

[[redirects]]
from = "/apple-icon-white.png"
to = "/apple-icon.png"
status = 301
