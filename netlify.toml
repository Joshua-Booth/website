[build]
publish = "out"
command = "pnpm run build"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/_next/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Deploy previews show the redesign as it will launch. The case studies and the
# Lab stay off: they're still in the old look
[context.deploy-preview.environment]
SITE_FLAGS = "redesign"

# The home screen icon is public/apple-icon.png; crawlers and audits ask for the conventional names
[[redirects]]
from = "/apple-touch-icon.png"
to = "/apple-icon.png"
status = 200

[[redirects]]
from = "/apple-touch-icon-precomposed.png"
to = "/apple-icon.png"
status = 200
